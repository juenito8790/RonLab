<meta property="og:type" content="website">
<meta property="og:title" content="RONLAB">
<meta property="og:description" content="비행체, 보행 로봇, 모터 드라이브를 직접 설계하고 만듭니다. 만드는 과정과 시행착오를 이곳에 기록합니다.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22-24%20-10%20184%20204%22%3E%3Crect%20x%3D%22-24%22%20y%3D%22-10%22%20width%3D%22184%22%20height%3D%22204%22%20rx%3D%2228%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20fill%3D%22%23151517%22%20d%3D%22M55.2%200H136V42.6L104%2054H136V122H44C44%20140%2056%20150.5%2072%20154L136%20168V184H0L25.2%20100H92Q104%20100%20104%2088V80H31.2L40.8%2048L108%2024H48Z%22%2F%3E%3C%2Fsvg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Saira:wght@300;400;500&display=swap">
<style id="site-style">
/* Layout: white two-tier header; pages open on a pale grey band with a faint nested-bracket line pattern and an oversized thin title; white and pale-grey content sheets; a single dark band at the footer. One light look for every viewer. */
:root{
  --bg:#ffffff; --fg:#151517; --muted:#5c5e66; --faint:#8b8d95; --line:#e1e2e6; --surface:#f3f3f5; --surface-2:#e9e9ed;
  --accent:#c8102e; --accent-fg:#ffffff; --accent-soft:#fcebee;
  --hero-bg:#f2f3f5; --hero-fg:#151517; --hero-muted:#5c5e66; --hero-accent:#c8102e; --pattern:rgba(21,21,23,.07);
  --panel:#ffffff; --panel-art:#ffffff; --panel-line:#dfe0e4; --dot:rgba(21,21,23,.07);
  --foot-bg:#151517; --foot-fg:#ffffff; --foot-muted:#a3a4ac; --foot-line:#2e2e33; --foot-accent:#ff5a6c;
  --photo-fg:#ffffff; --photo-muted:rgba(255,255,255,.8); --photo-accent:#ff5a6c;
  --overlay:rgba(12,12,14,.5); --scrim:rgba(0,0,0,.92); --shade-1:rgba(0,0,0,.7); --shade-2:rgba(0,0,0,.34); --bar-track:rgba(21,21,23,.18); --bar-track-photo:rgba(255,255,255,.35);
  --lift:0 18px 40px rgba(21,21,23,.10);
  --display:"Saira","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Saira",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gutter:clamp(16px,5.5vw,96px); --maxw:1260px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
body.modal-open{overflow:hidden}
body.editing{padding-bottom:64px}
a{color:inherit}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero :focus-visible,.site-footer :focus-visible{outline-color:var(--hero-accent)}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--muted)}
body:not(.editing) .e{display:none!important}
body.editing .v{display:none!important}
body:not(.can-write) .w{display:none!important}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:55;appearance:none;border:0;background:var(--accent);color:var(--accent-fg);font:500 15px/1 var(--body);padding:15px 20px;display:inline-flex;align-items:center;gap:9px;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.24)}
.fab:hover{background:var(--fg);color:var(--bg)}
.fab svg{flex:none}
body.editing .fab{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body.can-write .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.docno{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- header ---------- */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:94px;padding-block:10px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;min-width:0;color:var(--fg)}
.brand-mark{flex:none;display:grid;place-items:center;color:currentColor}
.brand-mark svg{width:auto;height:46px}
.brand-mark img{max-height:54px;width:auto;max-width:220px}
.bm-a{stroke:var(--mark-accent,var(--accent))}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-name{font-family:var(--display);font-weight:500;font-size:23px;letter-spacing:.08em;text-transform:uppercase;line-height:1;white-space:nowrap}
.brand-sub{font-size:11.5px;letter-spacing:.12em;color:var(--muted);margin-top:7px;line-height:1.2;white-space:nowrap}
.nav-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.util{display:flex;align-items:center;gap:22px;font-size:13px;color:var(--muted)}
.util a{text-decoration:none}
.util a:hover,.util a[aria-current="page"]{color:var(--fg)}
.util-edit{appearance:none;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:12px;padding:2px 10px;cursor:pointer}
.util-edit[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.main-row{display:flex;align-items:center;gap:34px}
.main-nav{display:flex;gap:34px;font-family:var(--display);font-size:18px;font-weight:400}
.main-nav a{text-decoration:none;padding-block:3px;border-bottom:2px solid transparent}
.main-nav a:hover{color:var(--accent)}
.main-nav a[aria-current="page"]{border-bottom-color:var(--accent)}
.icon-btn{appearance:none;border:0;background:none;padding:6px;cursor:pointer;color:var(--fg);display:inline-grid;place-items:center;line-height:1}
.search-btn{color:var(--accent)}
.mobile-ctl{display:none;gap:2px}
.drawer{border-top:1px solid var(--line);background:var(--bg);max-height:calc(100vh - 80px);overflow:auto}
.drawer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;padding-block:8px 24px}
.drawer a{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;font-family:var(--display);font-size:19px}
.drawer a small{font-family:var(--body);font-size:13px;color:var(--muted)}
.drawer a[aria-current="page"]{color:var(--accent)}
.drawer .btn{margin-top:16px;justify-self:start}
@media (max-width:1060px){
  .nav-wrap{display:none}
  .mobile-ctl{display:flex}
  .hdr{min-height:70px}
  .brand-name{font-size:19px}
  .brand-mark svg{width:auto;height:40px}
}
@media (max-width:520px){ .drawer-grid{grid-template-columns:minmax(0,1fr)} .brand-sub{display:none} }

/* ---------- hero ---------- */
.hero{position:relative;background:var(--hero-bg);color:var(--hero-fg);overflow:hidden;isolation:isolate;--mark-accent:var(--hero-accent)}
.hero-pattern{position:absolute;inset:0;width:100%;height:100%;z-index:-1;-webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.85) 28%,transparent 74%);mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.85) 28%,transparent 74%)}
.hero-inner{display:grid;grid-template-columns:minmax(0,1fr);gap:40px 56px;padding-block:clamp(84px,11vw,132px) clamp(52px,6.5vw,84px)}
.hero.has-panel .hero-inner{grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);align-items:start}
.hero-copy{min-width:0}
.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--hero-muted);margin:0 0 20px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.hero-title{font-family:var(--display);font-weight:300;line-height:1;letter-spacing:-.01em;margin:0;overflow-wrap:anywhere}
.hero-title.xl{font-size:clamp(52px,8.6vw,108px)}
.hero-title.l{font-size:clamp(40px,6vw,78px);line-height:1.04}
.hero-title.m{font-size:clamp(30px,4.2vw,52px);font-weight:400;line-height:1.22;letter-spacing:0}
.hero-lead{font-size:clamp(17px,1.5vw,21px);line-height:1.62;max-width:34em;margin:30px 0 0;color:var(--hero-fg)}
.hero-lead strong{display:block;font-weight:500;margin-bottom:6px}
.hero-panel{min-width:0;margin-top:clamp(0px,5vw,72px)}
.hero .status,.slider .status{color:var(--hero-fg)}
.hero .s-active,.slider .s-active{color:var(--hero-accent)}
.hero .s-planning,.hero .s-paused,.slider .s-planning,.slider .s-paused{color:var(--hero-muted)}
@media (max-width:900px){ .hero.has-panel .hero-inner{grid-template-columns:minmax(0,1fr)} .hero-panel{margin-top:0} }
.art-dark{aspect-ratio:16/10;max-width:100%;width:100%;display:grid;place-items:center;overflow:hidden;background-color:var(--panel-art);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:16px 16px;color:var(--hero-fg)}
.art-dark .mark{width:74%;height:auto}
.art-dark img{width:100%;height:100%;object-fit:cover}
.latest{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--panel-line);color:var(--hero-fg)}
.latest .art-dark{border-bottom:1px solid var(--panel-line)}
.latest-body{padding:20px 22px 22px;display:grid;gap:6px}
.latest-meta{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--hero-muted)}
.latest-proj{margin:6px 0 0;font-size:13.5px;color:var(--hero-muted)}
.latest-title{margin:0;font-size:20px;line-height:1.42;font-weight:500}
.latest-go{color:var(--hero-accent);font-size:14px;margin-top:4px}
.latest:hover .latest-title{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.proj-art{border:1px solid var(--panel-line)}

/* ---------- marks ---------- */
.mark .a{stroke:var(--mark-accent,var(--accent))}
.mark .d{stroke-dasharray:3 5}
.mark .m{opacity:.5}

/* ---------- sections ---------- */
.sec{padding-block:clamp(56px,7vw,100px)}
.sec + .sec{border-top:1px solid var(--line)}
.sec-alt{background:var(--surface)}
.sec-alt + .sec,.sec + .sec-alt{border-top:0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;margin-bottom:40px}
.sec-title{font-family:var(--display);font-weight:300;font-size:clamp(32px,4vw,48px);line-height:1.05;margin:0;letter-spacing:-.005em}
.sec-kicker{font-size:15px;color:var(--muted);margin:10px 0 0}
.more{font-size:15px;text-decoration:none;color:var(--fg);display:inline-flex;gap:8px;align-items:center;border-bottom:1px solid currentColor;padding-bottom:2px;white-space:nowrap}
.more:hover{color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:28px}
.sec.sec-tight{padding-block:0 clamp(48px,6vw,80px);border-top:0}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--fg);background:transparent;color:var(--fg);padding:10px 18px;font-size:15px;cursor:pointer;text-decoration:none;line-height:1.25;white-space:nowrap}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn-ghost{border-color:var(--line)}
.btn-sm{padding:7px 13px;font-size:14px}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.danger:hover{background:var(--accent);color:var(--accent-fg)}
.btn[disabled]{opacity:.55;cursor:progress}
.edit-btn{appearance:none;font-size:12.5px;border:1px solid var(--accent);color:var(--accent);background:var(--bg);padding:3px 10px;cursor:pointer;line-height:1.5;justify-self:start;align-self:start}
.edit-btn:hover{background:var(--accent);color:var(--accent-fg)}

/* status */
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--fg)}
.status i{display:inline-block;width:8px;height:8px;border:1.5px solid currentColor;border-radius:50%}
.s-active{color:var(--accent)} .s-active i{background:currentColor}
.s-design i{border-radius:1px}
.s-planning{color:var(--muted)}
.s-paused{color:var(--faint)} .s-paused i{border:0;border-radius:0;background:linear-gradient(90deg,currentColor 0 34%,transparent 34% 66%,currentColor 66%)}
.s-done i{border-radius:1px;background:currentColor}

/* chips & tags */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--bg);padding:6px 14px;border-radius:999px;font-size:14px;cursor:pointer;line-height:1.3}
.chip:hover{border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .docno{color:inherit;opacity:.7;margin-right:4px}
.filter-label{font-size:13px;color:var(--muted);margin-right:4px}
.filters{display:grid;gap:14px;margin-bottom:44px}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.tag{font-size:12.5px;border:1px solid var(--line);padding:2px 11px;border-radius:999px;color:var(--muted)}

/* empty */
.empty{border:1px dashed var(--line);padding:36px 28px;display:grid;gap:10px;justify-items:start;max-width:680px}
.empty h3{margin:0;font-size:18px;font-weight:600}
.empty p{margin:0;color:var(--muted)}

/* ---------- home ---------- */
.areas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 28px}
.area{border-top:2px solid var(--fg);padding-top:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.area-en{font-family:var(--display);font-size:24px;font-weight:400;line-height:1.18;margin:0}
.area-ko{font-size:14px;color:var(--muted);margin:0}
.area-desc{font-size:15px;margin:6px 0 0}
.area-projects{list-style:none;padding:0;margin:10px 0 0;display:grid;border-top:1px solid var(--line)}
.area-projects a{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:14.5px}
.area-projects a:hover{color:var(--accent)}
@media (max-width:1040px){ .areas{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .areas{grid-template-columns:minmax(0,1fr)} }

.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:44px 28px}
.pgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1040px){ .pgrid,.pgrid.three{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .pgrid,.pgrid.three{grid-template-columns:minmax(0,1fr)} }
.pcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;min-width:0}
.pcard-art{aspect-ratio:16/10;max-width:100%;background:var(--surface);display:grid;place-items:center;overflow:hidden;color:var(--fg)}
.sec-alt .pcard-art{background:var(--bg)}
.pcard-art .mark{width:70%;height:auto}
.pcard-art img{width:100%;height:100%;object-fit:cover}
.pcard-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.pcard-title{font-size:19px;font-weight:600;line-height:1.38;margin:0}
.pcard:hover .pcard-title{color:var(--accent)}
.pcard-en{font-family:var(--display);font-size:14.5px;color:var(--muted);margin:-4px 0 0}
.pcard-sum{font-size:14.5px;margin:2px 0 0;color:var(--muted)}
.pcard-foot{font-family:var(--mono);font-size:12px;color:var(--faint);margin:4px 0 0;font-variant-numeric:tabular-nums}

.split{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:56px;align-items:start}
.split-intro{display:grid;gap:14px;justify-items:start}
.split-intro .sec-kicker{margin:0}
.split-text{margin:0;color:var(--muted);max-width:28em}
@media (max-width:900px){ .split{grid-template-columns:minmax(0,1fr);gap:28px} }
.loglist{list-style:none;margin:0;padding:0;border-top:2px solid var(--fg)}
.logrow{display:grid;grid-template-columns:110px minmax(0,220px) minmax(0,1fr);gap:20px;padding:17px 0;border-bottom:1px solid var(--line);align-items:baseline}
.logrow time,.nrow time{font-family:var(--mono);font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lproj{font-size:14px;color:var(--muted);min-width:0}
.ltitle{font-weight:500;font-size:17px;text-decoration:none;min-width:0}
.ltitle:hover{color:var(--accent)}
@media (max-width:760px){ .logrow{grid-template-columns:minmax(0,1fr);gap:2px} }
.nlist{list-style:none;margin:0;padding:0;border-top:2px solid var(--fg)}
.nrow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:20px;padding:18px 0;border-bottom:1px solid var(--line);align-items:baseline}
.nrow a{font-weight:500;font-size:17px;text-decoration:none}
.nrow a:hover{color:var(--accent)}
.nrow p{margin:4px 0 0;color:var(--muted);font-size:15px}
@media (max-width:600px){ .nrow{grid-template-columns:minmax(0,1fr);gap:2px} }

/* ---------- research ---------- */
.rlist{border-top:2px solid var(--fg)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:24px 44px;padding:44px 0;border-bottom:1px solid var(--line)}
.rrow-head{display:grid;gap:8px;align-content:start}
.rrow-en{font-family:var(--display);font-weight:300;font-size:clamp(28px,3vw,38px);line-height:1.1;margin:0}
.rrow-desc{font-size:17px;margin:0}
.rrow-projects{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rrow-projects a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:15px}
.rrow-projects a:hover .rp-title{color:var(--accent)}
@media (max-width:960px){ .rrow{grid-template-columns:minmax(0,1fr)} }

/* ---------- project detail ---------- */
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:64px;align-items:start}
.spec{position:sticky;top:calc(env(safe-area-inset-top,0px) + 118px);border-top:2px solid var(--fg);padding-top:16px;display:grid;gap:14px}
.spec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.spec h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.spec dl{margin:0}
.spec-row{display:grid;grid-template-columns:minmax(0,96px) minmax(0,1fr);gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.spec dt{color:var(--muted);font-size:13.5px}
.spec dd{margin:0}
@media (max-width:960px){ .detail{grid-template-columns:minmax(0,1fr);gap:48px} .spec{position:static;order:-1} }
.revs{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.rev{position:relative;padding:0 0 38px 30px}
.rev:last-child{padding-bottom:4px}
.rev::before{content:"";position:absolute;left:-5px;top:7px;width:9px;height:9px;background:var(--bg);border:1.5px solid var(--fg)}

.thumbs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.pnav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;border-top:1px solid var(--line);padding-top:28px}

.pnav a strong{font-weight:500;font-size:17px}
.pnav a:hover strong{color:var(--accent)}
.pnav .next{text-align:right;justify-items:end}

/* ---------- dev log ---------- */
.logtools{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;margin-bottom:44px}
.searchbox{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--fg);padding:6px 2px;flex:1 1 220px;max-width:320px;min-width:0}
.searchbox:focus-within{border-bottom-color:var(--accent)}
.searchbox input{border:0;background:transparent;outline:none;font-size:16px;width:100%;min-width:0}
.searchbox svg{flex:none;color:var(--muted)}
.month{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:24px;padding-block:28px 8px;border-top:2px solid var(--fg)}
.month-h{font-family:var(--display);font-weight:300;font-size:34px;margin:0;line-height:1;display:flex;flex-direction:column;gap:10px}
.month-h small{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.entries{list-style:none;margin:0;padding:0}
.entry{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:20px;padding-bottom:26px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.entry time{font-family:var(--mono);font-size:14px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.entry-main{min-width:0;display:grid;gap:6px;justify-items:start}
.entry-main .lproj a{text-decoration:none}
.entry-main .lproj a:hover{color:var(--accent)}
.entry h3{margin:0;font-size:20px;font-weight:600;line-height:1.42}
.entry h3 a{text-decoration:none}
.entry h3 a:hover{color:var(--accent)}
.entry p{margin:0;color:var(--muted);font-size:15px;max-width:46em}
.entry-thumb{width:150px;aspect-ratio:4/3;max-width:100%;object-fit:cover}
@media (max-width:760px){ #lchips{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:6px;scrollbar-width:thin} #lchips .chip{white-space:nowrap;flex:none} .searchbox{max-width:none;flex-basis:100%} .month{grid-template-columns:minmax(0,1fr);gap:18px} .entry{grid-template-columns:52px minmax(0,1fr)} .entry-thumb{grid-column:2;width:100%;max-width:320px} }

.entry-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:72px;align-items:start}
@media (max-width:960px){ .entry-layout{grid-template-columns:minmax(0,1fr);gap:48px} }
.article{min-width:0;max-width:720px;display:grid;gap:28px;justify-items:start}
.prose{font-size:17px;line-height:1.82;min-width:0;max-width:100%}
.prose > :first-child{margin-top:0}
.prose p{margin:0 0 1.1em}
.prose ul,.prose ol{padding-left:1.3em;margin:0 0 1.1em}
.prose li{margin:.3em 0}
.prose h3{font-size:20px;line-height:1.4;margin:1.6em 0 .6em}
.prose code{font-family:var(--mono);font-size:.86em;background:var(--surface);padding:.12em .38em}
.prose pre{background:var(--surface);padding:16px 18px;overflow-x:auto;font-size:14px;line-height:1.6;border-left:2px solid var(--fg);margin:0 0 1.2em}
.prose pre code{background:none;padding:0;font-size:inherit}
.prose a{color:var(--accent)}
.prose strong{font-weight:600}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;width:100%}
.zoom{appearance:none;padding:0;border:0;background:var(--surface);cursor:zoom-in;display:block;width:100%;overflow:hidden}
.figs .zoom{aspect-ratio:4/3;max-width:100%}
.figs .zoom img{width:100%;height:100%;object-fit:cover}
.entry-aside{display:grid;gap:28px;min-width:0}
.aside-proj{display:grid;gap:8px;text-decoration:none;border-top:2px solid var(--fg);padding-top:14px;justify-items:start}
.aside-art{aspect-ratio:16/10;width:100%;max-width:100%;background:var(--surface);display:grid;place-items:center;overflow:hidden}

.aside-art img{width:100%;height:100%;object-fit:cover}
.aside-proj strong{font-size:17px;font-weight:600}
.aside-proj:hover strong{color:var(--accent)}
.pager{display:grid;border-top:1px solid var(--line)}
.pager a{display:grid;gap:2px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none}
.pager small{color:var(--muted);font-size:12.5px;font-family:var(--mono)}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:24px 56px}

.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin:0}

.facts dt{font-size:13.5px;color:var(--muted)}
.facts dd{margin:6px 0 0;font-family:var(--display);font-size:38px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
@media (max-width:700px){ .facts{grid-template-columns:repeat(2,minmax(0,1fr))} }
.hist{border-top:2px solid var(--fg)}
.hist-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:24px;padding:20px 0;border-bottom:1px solid var(--line)}
.hist-row h3{font-family:var(--mono);font-weight:500;font-size:15px;margin:2px 0 0;font-variant-numeric:tabular-nums}
.hist-row ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.hist-row li{display:flex;gap:14px;align-items:baseline}

@media (max-width:600px){ .hist-row{grid-template-columns:minmax(0,1fr);gap:8px} }
.qlinks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}

.qlink:hover strong{color:var(--accent)}
@media (max-width:760px){ .qlinks{grid-template-columns:minmax(0,1fr)} }

/* ---------- people ---------- */
.owner{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:56px;align-items:start}
.owner-photo{aspect-ratio:4/5;width:100%;max-width:100%;background:var(--surface);display:grid;place-items:center;overflow:hidden;color:var(--faint)}
.owner-photo img{width:100%;height:100%;object-fit:cover}
.owner-photo svg{width:30%;height:auto}
.owner-info{min-width:0}
.owner-name{font-family:var(--display);font-weight:300;font-size:clamp(34px,4vw,46px);line-height:1.1;margin:0}
.owner-name.unset{color:var(--faint)}
.owner-role{color:var(--accent);font-weight:500;margin:10px 0 0}
.owner-bio{font-size:17px;max-width:40em;margin:20px 0 0}
.mini-h{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:34px 0 12px;font-weight:500}
.owner-areas{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.owner-areas a{text-decoration:none}

@media (max-width:800px){ .owner{grid-template-columns:minmax(0,1fr);gap:28px} .owner-photo{max-width:260px} }
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px}
.person{border-top:1px solid var(--fg);padding-top:14px;display:grid;gap:4px;justify-items:start}
.person strong{font-size:18px;font-weight:600}
.person span{color:var(--accent);font-size:14px}
.person p{margin:4px 0 0;color:var(--muted);font-size:15px}

/* ---------- news ---------- */
.newslist{list-style:none;padding:0;margin:0;border-top:2px solid var(--fg)}
.news{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:24px;padding:30px 0;border-bottom:1px solid var(--line)}
.news time{font-family:var(--mono);color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.news-body{min-width:0;display:grid;gap:8px;justify-items:start}
.news h3{margin:0;font-size:21px;font-weight:600;line-height:1.4}
.news .prose{font-size:16px}
@media (max-width:640px){ .news{grid-template-columns:minmax(0,1fr);gap:6px} }

/* ---------- gallery ---------- */
.gallery{columns:3 240px;column-gap:18px}
.gitem{break-inside:avoid;margin:0 0 22px;display:grid;gap:8px}
.gitem img{width:100%;height:auto}
.gitem figcaption{font-size:14px;display:grid;gap:2px;justify-items:start}
.gitem figcaption a{text-decoration:none;color:var(--muted)}
.gitem figcaption a:hover{color:var(--accent)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:640px}
.tbl th{text-align:left;font-weight:500;font-size:13px;color:var(--muted);padding:12px 16px 12px 0;border-bottom:2px solid var(--fg);white-space:nowrap}
.tbl td{padding:16px 16px 16px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{white-space:nowrap}
.tbl .mono{font-family:var(--mono);font-size:13.5px;color:var(--muted);white-space:nowrap}
.tbl strong{font-weight:600}
.tbl a{color:var(--accent)}
.tbl .cat-row td{border-bottom:0;padding:30px 0 8px;font-family:var(--display);font-size:20px;font-weight:400}

/* ---------- contact ---------- */
.contact{display:grid;border-top:2px solid var(--fg);max-width:860px;margin:0}
.contact-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) auto;gap:16px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.contact-row dt{font-family:var(--display);font-size:22px;font-weight:300}
.contact-row dd{margin:0;min-width:0}
.cval{font-size:17px;overflow-wrap:anywhere;user-select:text}
.cval a{color:var(--accent)}
@media (max-width:600px){ .contact-row{grid-template-columns:minmax(0,1fr) auto} .contact-row dt{grid-column:1/-1} }

/* ---------- footer ---------- */
.site-footer{--hero-bg:var(--foot-bg);--hero-fg:var(--foot-fg);--hero-muted:var(--foot-muted);--hero-accent:var(--foot-accent);--panel-line:var(--foot-line);background:var(--hero-bg);color:var(--hero-fg);--mark-accent:var(--hero-accent)}
.site-footer .brand{color:var(--hero-fg)}
.site-footer .brand-sub{color:var(--hero-muted)}
.foot{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(2,minmax(0,1fr));gap:40px;padding-block:60px 44px}
.foot-brand{display:grid;gap:18px;align-content:start;justify-items:start}
.foot-brand p{margin:0;color:var(--hero-muted);font-size:14.5px;max-width:30em}
.foot h2{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hero-muted);margin:0 0 14px;font-weight:500}
.foot ul{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.foot a{text-decoration:none}
.foot ul a:hover{color:var(--hero-accent)}
.foot ul small{color:var(--hero-muted);margin-left:8px;font-size:12.5px}
.foot-bottom{border-top:1px solid var(--panel-line);padding-block:18px 22px;display:flex;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;font-size:13px;color:var(--hero-muted)}
@media (max-width:760px){ .foot{grid-template-columns:repeat(2,minmax(0,1fr))} .foot-brand{grid-column:1/-1} }

/* ---------- overlays ---------- */
#modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px}
.modal-back{position:absolute;inset:0;background:var(--overlay)}
.modal{position:relative;width:min(700px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--bg);border-top:3px solid var(--accent);padding:22px clamp(18px,4vw,30px) 28px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.modal-head h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.form{display:grid;gap:16px}
.form-sep{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px;margin:10px 0 0}
.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:560px){ .form-row{grid-template-columns:minmax(0,1fr)} }
.field{display:grid;gap:6px;min-width:0;border:0;padding:0;margin:0}
.field > span,.field legend{font-size:13.5px;font-weight:500;padding:0}
.field > span em{color:var(--accent);font-style:normal}
.field input,.field select,.field textarea{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);background:var(--bg);border-radius:0;font-size:15px;line-height:1.5}
.field textarea{resize:vertical;font-family:var(--body)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.img-list{display:flex;flex-wrap:wrap;gap:8px}
.img-item{position:relative;width:92px;height:92px;background:var(--surface)}
.img-item img{width:100%;height:100%;object-fit:cover}
.img-item.logo img{object-fit:contain}
.img-ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.img-status{font-size:13px;color:var(--muted)}
.form-err{color:var(--accent);font-size:14px;margin:0}
.form-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.sp{flex:1}
.confirm{border:1px solid var(--accent);background:var(--accent-soft);padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.confirm p{margin:0;flex:1 1 220px;font-size:14.5px}

.editbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--fg);color:var(--bg);padding:10px var(--gutter) calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;font-size:14px}
.editbar strong{font-weight:600}
.editbar .eb-note{opacity:.75}
.editbar .eb-usage{font-family:var(--mono);font-size:12.5px;opacity:.75}
.editbar button{appearance:none;border:1px solid currentColor;background:transparent;color:inherit;padding:5px 12px;cursor:pointer;font-size:13.5px}
.editbar button:hover{background:var(--bg);color:var(--fg)}
@media (max-width:640px){ .editbar .eb-note{display:none} }

.search{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.search-top{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--fg);padding-block:28px 10px;margin-top:20px}
.search-top:focus-within{border-bottom-color:var(--accent)}
#search-q{flex:1;font-family:var(--display);font-size:clamp(26px,4vw,44px);font-weight:300;border:0;background:transparent;outline:none;min-width:0;padding:0}
.search-res{padding-block:28px 64px;display:grid;gap:36px}
.sgroup h2{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
.sgroup ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.sgroup a{display:grid;gap:2px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
.sgroup a strong{font-weight:500;font-size:17px}
.sgroup a small{color:var(--muted);font-size:13.5px}
.sgroup a:hover strong{color:var(--accent)}

#lightbox{position:fixed;inset:0;z-index:95;background:var(--scrim);display:grid;place-items:center;padding:24px;cursor:zoom-out}
#lightbox figure{margin:0;display:grid;gap:12px;justify-items:center;max-width:100%}
#lightbox img{max-width:100%;max-height:calc(100vh - 110px);width:auto;height:auto}
#lightbox figcaption{color:#ffffff;font-size:14px;opacity:.85;text-align:center}
.lb-close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;color:#ffffff;font-size:30px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;background:var(--fg);color:var(--bg);padding:12px 16px;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px);font-size:14.5px;box-shadow:0 8px 28px rgba(0,0,0,.22)}
body.editing .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.toast button{appearance:none;border:1px solid currentColor;background:transparent;color:inherit;padding:4px 10px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--fg);color:var(--bg);padding:8px 14px;border:0}
.skip:focus{left:8px}

/* ---------- home slider ---------- */
.slider{position:relative;background:var(--hero-bg);color:var(--hero-fg);overflow:hidden;--mark-accent:var(--hero-accent);touch-action:pan-y}
.slider-track{display:flex;height:clamp(460px,74vh,780px);transition:transform .95s cubic-bezier(.77,0,.18,1);will-change:transform}
.slide{position:relative;flex:0 0 100%;min-width:0;height:100%;display:block;text-decoration:none;color:var(--hero-fg);overflow:hidden;user-select:none;-webkit-user-drag:none}
.slide-media{position:absolute;inset:0}
.slide-media img{width:100%;height:100%;object-fit:cover;transform:scale(1.07);transition:transform 7s cubic-bezier(.2,.6,.3,1);-webkit-user-drag:none;pointer-events:none}
.slide.is-active .slide-media img{transform:scale(1)}
.slide-media.drawn{background-color:var(--hero-bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:18px 18px;display:grid;align-items:center;justify-items:end;padding-right:clamp(16px,7vw,130px)}
.slide-media.drawn .mark{width:min(40vw,560px);height:auto;opacity:.9}
@media (min-width:901px){ .drawn-slide .slide-copy .wrap > *{max-width:54%} }
@media (max-width:900px){ .slide-media.drawn{align-items:start;justify-items:center;padding:56px 16px 0} .slide-media.drawn .mark{width:min(78vw,420px);opacity:.55} }
.slide:not(.drawn-slide){--hero-fg:var(--photo-fg);--hero-muted:var(--photo-muted);--hero-accent:var(--photo-accent);color:var(--hero-fg)}
.slide:not(.drawn-slide):hover .slide-cta,.slide:not(.drawn-slide):focus-visible .slide-cta{color:var(--fg)}
.drawn-slide .slide-shade{display:none}
.slider.on-photo{--hero-fg:var(--photo-fg);--hero-muted:var(--photo-muted);--bar-track:var(--bar-track-photo)}
.slide-shade{position:absolute;inset:0;background:linear-gradient(90deg,var(--shade-1) 0%,var(--shade-2) 46%,transparent 78%),linear-gradient(0deg,var(--shade-1),transparent 50%)}
.slide-copy{position:absolute;left:0;right:0;bottom:clamp(92px,13vh,128px)}
.slide-copy .wrap{display:grid;gap:12px;justify-items:start}
.slide .eyebrow{margin:0}
.slide-title{font-family:var(--display);font-weight:300;font-size:clamp(40px,6.2vw,88px);line-height:1.02;margin:0;max-width:min(9.5em,100%);letter-spacing:-.01em;text-wrap:balance}
.slide-ko{font-size:clamp(17px,1.6vw,21px);font-weight:500;margin:4px 0 0}
.slide-sum{max-width:34em;margin:0;color:var(--hero-muted);font-size:16px;line-height:1.6}
.slide-cta{display:inline-flex;gap:10px;align-items:center;margin-top:10px;border:1px solid var(--hero-fg);padding:11px 20px;font-size:15px}
.slide:hover .slide-cta,.slide:focus-visible .slide-cta{background:var(--hero-fg);color:var(--hero-bg)}
.slide:focus-visible{outline:2px solid var(--hero-accent);outline-offset:-4px}
.slider-ui{position:absolute;left:0;right:0;bottom:30px;z-index:2;pointer-events:none}

,["OS","JetPack 7.2.1 (Ubuntu)"],["음성 합성","Piper en_US-ryan-medium, length-scale 1.3"],["호출","이름 \"Sebastian\"만 불러도 반응"],["언어","영어"],["몸체","로우폴리 물고기, 얼굴~꼬리 시작 20 cm, 2색, 얼굴 뚜껑에 부품 수납"]]},{"id":"edf-mount","slug":"edf-mount","no":8,"ts":8,"mark":"edf","cover":"","title":"자전거 EDF 마운트","en":"Bicycle EDF Mount","status":"design","areas":["power"],"summary":"90 mm EDF를 자전거 뒤쪽 시트스테이와 체인스테이에 다는 마운트. ESC 자리까지 포함해 PA6-CF로 출력합니다.","specs":[["EDF","90 mm, 추력 3 kg"],["장착 위치","시트스테이 · 체인스테이"],["재료","PA6-CF 3D 프린팅"],["출력 한계","베드 340 × 320 × 340 mm"]]}],"logs":[{"id":"l1","ts":1,"project":"bwb","date":"2026-09-29","title":"스플릿 요 적용, 에일러론-러더 믹싱 끔","body":"ArduPlane으로 BWB 기체를 세팅했다. 수직 꼬리날개 대신 스플릿 요(드래그 러더)로 방향을 잡는다.\n\n- 요 제어: 스플릿 요 / 드래그 러더\n- 에일러론-러더 믹싱을 끄고 따로 조정","tags":["ArduPilot","세팅"],"images":[]},{"id":"l2","ts":2,"project":"edf-mount","date":"2026-10-02","title":"마운트 사양 정리","body":"90 mm EDF(추력 3 kg)를 뒤쪽 시트스테이와 체인스테이 사이에 달기로 했다. ESC가 들어갈 공간도 마운트에 같이 넣는다.\n\n- 재료: PA6-CF\n- 프린터 베드 340 × 320 × 340 mm 안에 들어가게 설계\n- 다음: 장착 부위 프레임 사진을 찍고 치수 정리","tags":["설계","3D 프린팅"],"images":[]},{"id":"l3","ts":3,"project":"tiltwing","date":"2026-10-04","title":"장비 확정과 비행 목표 정리","body":"보유 장비로 구성을 정했다. 비행 컨트롤러는 Matek F765-WING, 영상 분석은 Jetson Orin Nano, 보조로 Raspberry Pi.\n\n구조는 모터 4개 틸트윙으로 Petrodynamics Transwing과 비슷하다.\n\n- 이착륙: 회전익 모드\n- 순항: 고정익 모드\n- 미션이 시작되면 자동 전환\n- 최종 목표: 자율비행 + YOLO로 상공 객체 분석","tags":["구성","VTOL"],"images":[]},{"id":"l4","ts":4,"project":"follow-drone","date":"2026-10-04","title":"추적 방식은 비전으로 결정","body":"GPS나 텔레메트리 대신 카메라로 피사체를 락온해서 따라가는 방식으로 정했다.\n\n실제 목표는 직접 만든 비행기(최대 약 110 km/h, 정속 직선 비행)를 드론이 지상에서 이륙해 따라잡고, 일정 거리를 두고 추적 촬영하는 것.","tags":["결정","비전"],"images":[]},{"id":"l5","ts":5,"project":"robot-dog","date":"2026-10-05","title":"크기와 관절 구동 방식 결정","body":"길이 75 cm · 높이 45 cm(GIM8108) 안도 봤지만 가격 때문에 길이 약 60 cm 사양으로 돌아왔다. 목표 무게는 4–5 kg, 10 kg은 너무 무겁다.\n\n- 12관절 BLDC 구동\n- 기성 액추에이터 대신 저가 BLDC + 3D 프린트 사이클로이드 감속기 자작\n- 모터 후보: 5010 360KV\n- 스텝모터 사이클로이드도 검토했었음\n\n우선 걷는 것까지가 목표. 이후 라이다를 달아 걸으면서 장애물을 피하게 할 계획.","tags":["결정","액추에이터"],"images":[]},{"id":"l6","ts":6,"project":"sebastian","date":"2026-10-08","title":"JetPack 6.2.1 부팅 실패 → 7.2.1을 SSD에 설치","body":"보드 펌웨어가 39.2.0(JetPack 7.2 계열)이라 JetPack 6.2.1 SD 이미지로는 부팅이 되지 않았다.\n\nJetPack 7.2.1을 USB ISO로 512GB SSD에 설치하고 Ubuntu 초기 설정까지 마쳤다. 작업 환경은 USB-C 포트만 있는 노트북.","tags":["트러블슈팅","Jetson"],"images":[]},{"id":"l7","ts":7,"project":"sebastian","date":"2026-10-08","title":"목소리, 이름, 몸체 결정","body":"- 음성 합성: Piper `en_US-ryan-medium`\n- 말 속도: length-scale 1.2 → 1.3 (조금 더 느리게)\n- 이름은 Sebastian, 이름만 불러도 반응\n- 언어는 다국어 대신 영어만\n\n몸체는 식빵 자세 고양이에서 로우폴리 물고기 캐릭터로 바꿨다. 성격은 맥주를 좋아하는 물고기. 얼굴~꼬리 시작 20 cm, 얼굴과 몸통 2색, 얼굴 뚜껑을 열어 부품을 넣는다. 서보와 아두이노는 빼기로 했다.","tags":["결정","TTS"],"images":[]},{"id":"l8","ts":8,"project":"vvvf-inverter","date":"2026-10-09","title":"내 모터에 맞춘 인버터 기판부터 설계","body":"Booth에서 PVE-3ACinv-300-10A 인버터 기판과 Raspberry Pi Pico 제어 프로그램을 샀다. 그런데 기판에 들어가는 부품을 구하기가 어렵다.\n\n필요 없는 부품을 빼고 MY1018Z(36V 500W, 홀센서)에 맞춘 기판을 새로 만드는 것부터 시작하기로 했다. PCB는 JLCPCB에 부품 조립까지 맡길 예정.\n\n조작도 바꿨다. 처음에는 -100/0/+100 조이스틱(음수는 모터 브레이크)을 생각했는데, 출력과 중립만 쓰기로 했다. 모터 제동은 없음.","tags":["결정","PCB"],"images":[]},{"id":"l9","ts":9,"project":"vvvf-ebike","date":"2026-10-10","title":"외장 모터 대신 허브 모터 검토","body":"인버터 기판 비용이 생각보다 크다. 외장 모터 대신 휠에 모터가 들어간 36V 기어 허브 모터(알리익스프레스)를 뒷바퀴에 다는 쪽을 검토하고 있다.\n\n- 뒤 드롭아웃 간격 약 130 mm\n- 뒤 8단 카세트, 최소 기어 11T\n- 제어 보드는 예산상 NUCLEO-G431KB 하나로 진행\n- 회생 제동 없이 출력 + 중립만","tags":["부품","검토"],"images":[]},{"id":"lmv2ixbpky9i","ts":1791644624625,"project":"bwb","date":"2026-10-11","title":"망했다","body":"와 ㅅㅂ 개망했다 ㅋㅋ 추락함ㅋ ㅅㄱ","tags":["#요이~"],"images":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAACh const FIG_RE = /^\s*\[사진\s*(\d+)\s*(?:[:：]\s*([^\]]*))?\]\s*$/;
function md(src, imgs, used){
  const lines = String(src || '').replace(/\r/g, '').split('\n');

    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const isBlock = l => FIG_RE.test(l) || /^```/.test(l) || /^#{2,3}\s/.test(l) || /^\s*[-*]\s+/.test(l) || /^\s*\d+\.\s+/.test(l);

  while (i < lines.length) {
    const l = lines[i];

    if (fm) { const n = +fm[1] - 1, cap = (fm[2] || '').trim(), src = (imgs || [])[n]; if (src) { if (used) used.add(n); out += '<figure class="inline-fig">' + zoomable(src, cap) + (cap ? '<figcaption>' + esc(cap) + '</figcaption>' : '') + '</figure>'; } i++; continue; }
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; } i++; out += '<pre><code>' + esc(buf.join('\n')) + '</code></pre>'; continue; }
    if (/^#{2,3}\s/.test(l)) { out += '<h3>' + inline(l.replace(/^#+\s/, '')) + '</h3>'; i++; continue; }
    if (/^\s*[-*]\s+/.test(l)) { const items = []; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push('<li>' + inline(lines[i].replace(/^\s*[-*]\s+/, '')) + '</li>'); i++; } out += '<ul>' + items.join('') + '</ul>'; continue; }
    if (/^\s*\d+\.\s+/.test(l)) { const items = []; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { items.push('<li>' + inline(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>'); i++; } out += '<ol>' + items.join('') + '</ol>'; continue; }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !isBlock(lines[i])) { buf.push(inline(lines[i])); i++; }
    out += '<p>' + buf.join('<br>') + '</p>';

}

/* ---------------- router ---------------- */
const PAGES = { home: pageHome, about: pageAbout, research: pageResearch, projects: pageProjects, log: pageLog, people: pagePeople, news: pageNews, gallery: pageGallery, archive: pageArchive, facilities: pageFacilities, contact: pageContact };
function route(){
  const h = decodeURIComponent((location.hash || '').slice(1));
  if (!h || h === 'home') return { page: 'home' };
  if (h.indexOf('p-') === 0) return { page: 'project', slug: h.slice(2) };
  if (h.indexOf('log-') === 0) return { page: 'entry', id: h.slice(4) };
  if (h.indexOf('projects-') === 0 && CAT_KEYS.includes(h.slice(9))) return { page: 'projects', cat: h.slice(9) };
  if (PAGES[h]) return { page: h };
  return { page: 'missing' };
}
function render(){
  closeMega(true);
  const r = route(); ZOOM = []; destroySlider(); QA.composeKey = ''; QA.replyTo = null; QA.confirmDel = null;
  const cur = r.page === 'project' ? 'projects' : r.page === 'entry' ? 'log' : r.page;
  $('#hdr').innerHTML = headerHtml(cur);
  let html;
  if (r.page === 'project') html = pageProject(r.slug);
  else if (r.page === 'entry') html = pageEntry(r.id);
  else if (r.page === 'missing') html = pageNotFound();
  else html = PAGES[r.page](r);
  $('#main').innerHTML = html;
  $('#ftr').innerHTML = footerHtml();
  const p = r.page === 'project' ? projBySlug(r.slug) : null;
  const l = r.page === 'entry' ? STATE.logs.find(x => x.id === r.id) : null;
  const nm = STATE.site.nameEn || 'Project Lab';
  const label = { home: '', about: 'About', research: 'Research', projects: 'Projects', log: 'Dev Log', people: 'People', news: 'News', gallery: 'Gallery', archive: 'Archive', facilities: 'Facilities', contact: 'Contact' }[r.page];
  try { document.title = p ? p.title + ' · ' + nm : l ? l.title + ' · ' + nm : label ? label + ' · ' + nm : nm; } catch (e) {}
  const fab = $('#fab'); if (fab) { fab.dataset.project = p ? p.slug : (l && l.project) || ''; fab.setAttribute('aria-label', p ? p.title + '에 글쓰기' : '새 글쓰기'); }
  setupPattern(); setupSlider(); if (r.page === 'entry') renderQA();
}

  const ret = kind === 'log' ? '#log-' + id : null;
  return commit(next => {
    const arr = next[def.coll];
    let item = arr.find(x => x.id === id);
    if (!item) {
      item = { id, ts: Date.now() };
      if (kind === 'project') {
        item.no = arr.reduce((m, x) => Math.max(m, x.no || 0), 0) + 1;
        let base = slugify(vals.en || '') || 'project-' + item.no, slug = base, k = 2;
        while (arr.some(x => x.slug === slug)) slug = base + '-' + (k++);
        item.slug = slug;
      }
      arr.push(item);
    }
    Object.assign(item, vals, { rev });
  }, { kind, id, rev, values: vals }, ret);
}
function deleteItem(kind, id){
  const def = FORMS[kind];
  const ret = kind === 'log' ? '#log' : kind === 'project' ? '#projects' : null;
  return commit(next => { next[def.coll] = next[def.coll].filter(x => x.id !== id); }, { kind, id, del: true }, ret);
}

function skeletonReset(){
  const styles = document.head ? document.head.querySelectorAll('style') : [];
  for (let i = 0; i < styles.length; i++) { const t = styles[i].textContent || ''; if (t.indexOf('safe-area-inset') !== -1 && t.indexOf('[hidden]') !== -1) return t; }
  return FALLBACK_RESET;
}
function buildDocument(state){
  const css = document.getElementById('site-style').textContent;
  const js = document.getElementById('site-app').textContent;
  const json = JSON.stringify(state).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + skeletonReset() + '</style></head><body>'
    + '<title>' + esc(state.site.nameEn || 'Project Lab') + '</title>\n' + FONT_LINK + '\n<style id="site-style">' + css + '</style>\n<div id="app"></div>\n'
    + '<script type="application/json" id="site-data">' + json + '<\/script>\n<script id="site-app">' + js + '<\/script>\n</body></html>';

const mb = n => (n / 1048576).toFixed(1);
function setSaving(on){
  const b = $('#form-save'); if (b) { b.disabled = on; b.textContent = on ? '게시하는 중…' : '저장하고 게시'; }
  const d = $('#form-del-yes'); if (d) d.disabled = on;
}
function stash(p){
  if (store.set('pl-pending', JSON.stringify(p), true)) return;
  const lite = Object.assign({}, p, { values: {} });
  Object.keys(p.values || {}).forEach(k => { const v = p.values[k]; if (typeof v === 'string' && v.indexOf('data:') === 0) return; if (Array.isArray(v) && v.some(x => typeof x === 'string' && x.indexOf('data:') === 0)) return; lite.values[k] = v; });
  store.set('pl-pending', JSON.stringify(lite), true);
}
async function commit(mutate, pending, returnHash){
  if (!ART || !WRITABLE) { formError('이 화면은 읽기 전용이라 저장할 수 없어요.'); return false; }
  if (BUSY) return false;
  const next = JSON.parse(JSON.stringify(STATE));
  mutate(next); next.updated = today();
  const html = buildDocument(next);
  const bytes = new Blob([html]).size;
  if (bytes > 15.7 * 1048576) { formError('저장하면 페이지가 ' + mb(bytes) + 'MB가 되어 한도(16MB)를 넘어요. 사진 수를 줄이거나 작은 사진을 올려 주세요.'); return false; }
  BUSY = true; setSaving(true);
  stash(pending);
  store.set('pl-return', returnHash || location.hash || '', true);
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      await ART.publish(html);
      store.del('pl-pending', true);
      store.set('pl-flash', pending && pending.del ? '삭제했어요.' : '저장하고 게시했어요.', true);
      STATE = next; BUSY = false; closeModal(); render(); applyEditing();
      return true;
    } catch (e) {
      const code = e && e.code;
      if (code === 'upstream_error' && attempt === 0) { await sleep(600 + Math.random() * 900); continue; }
      BUSY = false; setSaving(false); store.del('pl-return', true);
      if (code === 'conflict') { formError('다른 곳에서 먼저 저장한 버전이 있어 최신 버전을 불러옵니다. 작성한 내용은 다시 불러와서 열 수 있어요.'); return false; }
      store.del('pl-pending', true);
      if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'capability_removed', 'not_declared'].includes(code)) { WRITABLE = false; EDITING = false; document.body.classList.remove('can-write'); closeModalForce(); render(); applyEditing(); toast('이 화면은 읽기 전용이라 저장할 수 없어요.'); return false; }
      if (code === 'too_large') { formError('페이지 용량 한도(16MB)를 넘었어요. 사진 수를 줄이거나 작은 사진을 올려 주세요.'); return false; }
      if (code === 'rate_limited') { formError('저장이 너무 잦아요. 잠시 뒤에 다시 저장해 주세요.'); return false; }
      if (code === 'invalid_content' || code === 'transform_error') { formError('페이지를 만드는 중 문제가 생겨 저장하지 못했어요. 방금 넣은 내용을 확인해 주세요.'); return false; }
      formError('저장 서버가 응답하지 않아요. 잠시 뒤에 다시 시도해 주세요.');
      return false;
    }
  }
  return false;
}
function closeModalForce(){ const root = $('#modal'); if (!root) return; root.hidden = true; root.innerHTML = ''; FORM = null; IMG = {}; document.body.classList.remove('modal-open'); }

function applyEditing(){
  document.body.classList.toggle('editing', !!(WRITABLE && EDITING));
  const bar = $('#editbar');
  if (!WRITABLE || !EDITING) { bar.hidden = true; return; }
  let usage = '';

  bar.innerHTML = '<strong>편집 모드</strong><span class="eb-note">저장하면 바로 새 버전으로 게시됩니다.</span><span class="eb-usage">' + usage + '</span><span class="sp"></span><button type="button" data-edit="site">사이트 설정</button><button type="button" data-toggle-edit>편집 끄기</button>';

function handlePending(){
  const raw = store.get('pl-pending', true); if (!raw) return;
  store.del('pl-pending', true);
  let p; try { p = JSON.parse(raw); } catch (e) { return; }
  if (!p || !p.kind) return;
  let saved;
  if (p.kind === 'site') saved = STATE.site.rev === p.rev;
  else { const def = FORMS[p.kind]; if (!def) return; const arr = STATE[def.coll]; saved = p.del ? !arr.some(x => x.id === p.id) : arr.some(x => x.id === p.id && x.rev === p.rev); }
  if (saved || p.del) return;
  toast('저장하지 못한 내용이 있어요.', { label: '다시 열기', fn: () => { EDITING = true; store.set('pl-edit', '1', true); render(); applyEditing(); openEditor(p.kind, p.id, p.values); } }, 15000);
}


/* ---------------- Q&A (shared, stored in the artifact database) ---------------- */
const QA = { state: 'loading', db: null, user: null, me: null, owner: null, isOwner: false, canWrite: null, rows: [], docs: {}, busy: false, replyTo: null, confirmDel: null, composeKey: '' };
const qaCount = post => QA.rows.filter(r => r.post === post && !r.reply).length;
async function initQA(){
  const C = window.claude;
  if (!C || typeof C.use !== 'function') { QA.state = 'off'; renderQA(); return; }
  try {
    const both = await Promise.all([C.use('db'), C.use('user')]);
    const db = both[0], user = both[1];
    QA.user = user;
    if (!db) { QA.state = 'off'; renderQA(); return; }
    QA.db = db;
    if (user) {
      QA.me = await user.id(); QA.isOwner = await user.isOwner();
      const c = await user.can('data.write'); QA.canWrite = QA.isOwner ? true : c;
    }
    try { const m = await db.doc('meta/owner').get(); QA.owner = m.exists ? ((m.data() || {}).uid || null) : null; } catch (e) {}
    if (QA.isOwner && QA.me && QA.owner !== QA.me) { try { await db.doc('meta/owner').set({ uid: QA.me }); QA.owner = QA.me; } catch (e) {} }
    db.collection('qa').onSnapshot(snap => {
      const rows = [], docs = {};
      snap.docs.forEach(d => { const data = d.data() || {}; docs[d.id] = data; const it = data.items || {}; Object.keys(it).forEach(k => { const v = it[k] || {}; rows.push({ id: k, uid: d.id, post: v.post, text: String(v.text || ''), ts: +v.ts || 0, reply: v.reply || null }); }); });
      QA.rows = rows; QA.docs = docs; QA.state = 'ready'; renderQA();
      const feed = $('#logfeed'); if (feed && route().page === 'log') feed.innerHTML = logFeed();
    }, () => { QA.state = 'error'; renderQA(); });
  } catch (e) { QA.state = 'off'; renderQA(); }
}
function qaTime(ts){ const d = new Date(ts); return d.getFullYear() + '.' + pad2(d.getMonth() + 1) + '.' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function qaName(uid, ps){ const p = ps[uid]; return (p && p.name) || (uid === QA.owner ? '운영자' : '방문자'); }
function qaCanWrite(){ return QA.state === 'ready' && !!QA.me && QA.canWrite !== false; }
function qaItem(r, ps, kids){
  const owner = r.uid === QA.owner, canDel = r.uid === QA.me || QA.isOwner;
  return '<li class="qa-item' + (r.reply ? ' is-reply' : '') + '"><div class="qa-meta"><span class="qa-mark" aria-hidden="true">' + (r.reply ? (owner ? 'A' : '↳') : 'Q') + '</span><strong>' + esc(qaName(r.uid, ps)) + '</strong>' + (owner ? '<span class="qa-badge">운영자</span>' : '') + '<time>' + qaTime(r.ts) + '</time></div>'
    + '<p class="qa-text">' + esc(r.text) + '</p>'
    + '<div class="qa-actions">' + (!r.reply && qaCanWrite() ? '<button type="button" data-qa-reply="' + esc(r.id) + '">답변하기</button>' : '') + (canDel ? '<button type="button" data-qa-del="' + esc(r.id) + '" data-uid="' + esc(r.uid) + '">삭제</button>' : '') + '</div>'
    + (QA.confirmDel === r.id ? '<div class="confirm"><p>' + (r.reply ? '이 답변을' : '이 질문을') + ' 삭제할까요? 되돌릴 수 없어요.</p><button type="button" class="btn btn-primary btn-sm" data-qa-del-yes="' + esc(r.id) + '" data-uid="' + esc(r.uid) + '">삭제</button><button type="button" class="btn btn-ghost btn-sm" data-qa-del-no>취소</button></div>' : '')
    + (kids && kids.length ? '<ul class="qa-replies">' + kids.map(k => qaItem(k, ps, null)).join('') + '</ul>' : '')
    + (QA.replyTo === r.id ? '<div class="qa-form qa-reply-form"><label class="sr-only" for="qa-reply-text">답변</label><textarea id="qa-reply-text" maxlength="2000" placeholder="답변을 입력하세요"></textarea><div class="row"><span class="qa-err" id="qa-reply-err" role="alert"></span><span><button type="button" class="btn btn-ghost btn-sm" data-qa-reply-cancel>취소</button><button type="button" class="btn btn-primary btn-sm" data-qa-reply-send="' + esc(r.id) + '">답변 올리기</button></span></div></div>' : '')
    + '</li>';
}
let qaSeq = 0;
async function renderQA(){
  const box = $('#qa-box'); if (!box) return;
  const post = box.dataset.post, list = $('#qa-list'), compose = $('#qa-compose'), count = $('#qa-count');
  let key, html = '';
  if (QA.state === 'loading') key = 'loading';
  else if (QA.state === 'off') { key = 'off'; html = '<p class="qa-note">이 화면에서는 Q&amp;A를 불러올 수 없어요. claude.ai에 로그인한 상태로 열면 보여요.</p>'; }
  else if (QA.state === 'error') { key = 'error'; html = '<p class="qa-note">Q&amp;A를 불러오지 못했어요. 페이지를 새로 고쳐 주세요.</p>'; }
  else if (!QA.me) { key = 'anon'; html = '<p class="qa-note">질문을 남기려면 claude.ai에 로그인해 주세요.</p>'; }
  else if (QA.canWrite === false) { key = 'ro'; html = '<p class="qa-note">질문은 사이트 주인이 초대한 사람만 남길 수 있어요.</p>'; }
  else { key = 'form'; html = '<form class="qa-form" id="qa-form"><label class="sr-only" for="qa-text">질문</label><textarea id="qa-text" maxlength="2000" placeholder="이 글에 대해 궁금한 점을 남겨 주세요."></textarea><div class="row"><span class="qa-err" id="qa-err" role="alert"></span><span><button type="submit" class="btn btn-primary btn-sm" id="qa-send">질문 남기기</button></span></div></form>'; }
  if (QA.composeKey !== key) { compose.innerHTML = html; QA.composeKey = key; }
  if (QA.state !== 'ready') { list.innerHTML = QA.state === 'loading' ? '<li class="qa-note">질문을 불러오는 중…</li>' : ''; count.textContent = ''; return; }
  const rows = QA.rows.filter(r => r.post === post);
  const roots = rows.filter(r => !r.reply).sort((a, b) => a.ts - b.ts);
  const kids = id => rows.filter(r => r.reply === id).sort((a, b) => a.ts - b.ts);
  count.textContent = roots.length ? '질문 ' + roots.length + '개' : '';
  const ids = Array.from(new Set(rows.map(r => r.uid)));
  const seq = ++qaSeq;
  let ps = {};
  if (QA.user && ids.length) { try { ps = await QA.user.profiles(ids); } catch (e) { ps = {}; } }
  if (seq !== qaSeq || !document.body.contains(list)) return;
  const draftEl = $('#qa-reply-text'), draft = draftEl ? draftEl.value : '';
  list.innerHTML = roots.length ? roots.map(r => qaItem(r, ps, kids(r.id))).join('') : '<li class="qa-note">아직 질문이 없어요.</li>';
  const d2 = $('#qa-reply-text'); if (d2 && draft) d2.value = draft;
}
async function qaSaveItems(uid, items){
  try { await QA.db.doc('qa/' + uid).set({ items }); }
  catch (e) { if (e && e.code === 'unavailable') { await sleep(500 + Math.random() * 800); await QA.db.doc('qa/' + uid).set({ items }); } else throw e; }
}
function qaFail(e, errEl){
  const code = e && e.code;
  if (code === 'invalid_argument') { QA.canWrite = false; QA.composeKey = ''; renderQA(); toast('이 계정으로는 질문을 저장할 수 없어요.'); return; }
  const msg = code === 'quota_exceeded' ? 'Q&A 저장 공간이 가득 찼어요. 오래된 질문을 지운 뒤 다시 시도해 주세요.' : code === 'resource_exhausted' ? '너무 빨리 보내고 있어요. 잠시 뒤에 다시 시도해 주세요.' : code === 'revoked' ? '접근 권한이 바뀌어 저장하지 못했어요. 페이지를 새로 고쳐 주세요.' : '저장하지 못했어요. 잠시 뒤에 다시 시도해 주세요.';
  if (errEl) errEl.textContent = msg; else toast(msg);
}
async function qaPost(text, reply, errEl, btn){
  text = String(text || '').trim();
  if (!text) { if (errEl) errEl.textContent = '내용을 입력해 주세요.'; return false; }
  if (QA.busy || !qaCanWrite()) return false;
  const box = $('#qa-box'); if (!box) return false;
  QA.busy = true; if (btn) btn.disabled = true; if (errEl) errEl.textContent = '';
  const items = JSON.parse(JSON.stringify((QA.docs[QA.me] || {}).items || {}));
  items['c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5)] = { post: box.dataset.post, text: text.slice(0, 2000), ts: Date.now(), reply: reply || null };
  let ok = false;
  try { await qaSaveItems(QA.me, items); ok = true; } catch (e) { qaFail(e, errEl); }
  QA.busy = false; if (btn) btn.disabled = false;
  return ok;
}
async function qaDelete(id, uid){
  if (QA.busy) return;
  const cur = (QA.docs[uid] || {}).items || {}; if (!cur[id]) return;
  QA.busy = true;
  const items = JSON.parse(JSON.stringify(cur)); delete items[id];
  try { await qaSaveItems(uid, items); QA.confirmDel = null; toast('삭제했어요.'); } catch (e) { qaFail(e, null); }
  QA.busy = false; renderQA();
}

  const rt = t.closest('[data-rt]'); if (rt) { richTool(rt.dataset.rt); return; }
  const go = t.closest('[data-go]'); if (go && SL) { SL.go(+go.dataset.go); return; }
  const stp = t.closest('[data-step]'); if (stp && SL) { SL.go(SL.i + (+stp.dataset.step)); return; }
  if (t.closest('[data-toggle-play]') && SL) { SL.setPlay(!SL.playing); return; }
  const qr = t.closest('[data-qa-reply]'); if (qr) { QA.replyTo = qr.dataset.qaReply; QA.confirmDel = null; renderQA().then(() => { const x = $('#qa-reply-text'); if (x) x.focus(); }); return; }
  if (t.closest('[data-qa-reply-cancel]')) { QA.replyTo = null; renderQA(); return; }
  const qs = t.closest('[data-qa-reply-send]'); if (qs) { const ta = $('#qa-reply-text'); qaPost(ta ? ta.value : '', qs.dataset.qaReplySend, $('#qa-reply-err'), qs).then(ok => { if (ok) { if (ta) ta.value = ''; QA.replyTo = null; renderQA(); } }); return; }
  const qd = t.closest('[data-qa-del]'); if (qd) { QA.confirmDel = qd.dataset.qaDel; renderQA(); return; }
  if (t.closest('[data-qa-del-no]')) { QA.confirmDel = null; renderQA(); return; }
  const qy = t.closest('[data-qa-del-yes]'); if (qy) { qaDelete(qy.dataset.qaDelYes, qy.dataset.uid); return; }
  if (t.closest('#form-del')) { const c = $('#form-confirm'); c.hidden = false; $('#form-del-no').focus(); return; }
  if (t.closest('#form-del-no')) { $('#form-confirm').hidden = true; return; }
  if (t.closest('#form-del-yes')) { if (FORM && FORM.onDelete) FORM.onDelete(); return; }
  const cp = t.closest('[data-copy]'); if (cp) { copyVal(cp.dataset.copy, cp); return; }
  const lf = t.closest('[data-lf]'); if (lf) { LF.project = lf.dataset.lf; document.querySelectorAll('[data-lf]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lf === LF.project))); ZOOM = []; $('#logfeed').innerHTML = logFeed(); return; }
  const lu = t.closest('[data-lu]'); if (lu) { selectLineup(lu.dataset.lu); return; }
  const gf = t.closest('[data-gf]'); if (gf) { GF.project = gf.dataset.gf; document.querySelectorAll('[data-gf]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.gf === GF.project))); ZOOM = []; $('#gfeed').innerHTML = galleryFeed(); return; }
  const af = t.closest('[data-af]'); if (af) { AF.cat = af.dataset.af; document.querySelectorAll('[data-af]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.af === AF.cat))); $('#afeed').innerHTML = archiveFeed(); return; }
  if (t.closest('[data-skip]')) { const m = $('#main'); if (m) m.focus(); return; }
});
document.addEventListener('submit', e => {
  if (e.target && e.target.id === 'modal-form') { e.preventDefault(); submitForm(); }
  else if (e.target && e.target.id === 'qa-form') { e.preventDefault(); const ta = $('#qa-text'); qaPost(ta.value, null, $('#qa-err'), $('#qa-send')).then(ok => { if (ok) ta.value = ''; }); }
});
document.addEventListener('paste', e => {
  if (!e.target.matches || !e.target.matches('textarea[data-rich]')) return;
  const files = Array.from((e.clipboardData && e.clipboardData.files) || []).filter(f => /^image\//.test(f.type));
  if (files.length) { e.preventDefault(); addRichImages(files); }
});
document.addEventListener('dragover', e => { if (e.target.matches && e.target.matches('textarea[data-rich]')) { e.preventDefault(); e.target.classList.add('drag'); } });
document.addEventListener('dragleave', e => { if (e.target.matches && e.target.matches('textarea[data-rich]')) e.target.classList.remove('drag'); });
document.addEventListener('drop', e => {
  if (!e.target.matches || !e.target.matches('textarea[data-rich]')) return;
  e.preventDefault(); e.target.classList.remove('drag');
  const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []).filter(f => /^image\//.test(f.type));
  if (files.length) { const ta = e.target; if (typeof document.caretPositionFromPoint === 'function') { /* keep current caret */ } addRichImages(files); }
});
document.addEventListener('input', e => {
  if (e.target.matches && e.target.matches('textarea[data-rich]')) return;
  if (e.target.id === 'log-q') { LF.q = e.target.value; ZOOM = []; $('#logfeed').innerHTML = logFeed(); }
  else if (e.target.id === 'search-q') renderSearch(e.target.value);
});
document.addEventListener('change', e => {
  if (!e.target.matches) return;
  if (e.target.matches('input[type=file][data-img-key]')) addImages(e.target);
  else if (e.target.matches('input[type=file][data-rich-file]')) { const files = Array.from(e.target.files || []); e.target.value = ''; addRichImages(files); }
});
document.addEventListener('pointerover', e => {
  if (e.pointerType && e.pointerType !== 'mouse') return;
  const t = e.target;
  if (t.closest('[data-mega]') || t.closest('#mega')) { openMega(); const mc = t.closest('[data-mega-cat]'); if (mc) setMegaCat(mc.dataset.megaCat); }
});
document.addEventListener('pointerout', e => {
  if (e.pointerType && e.pointerType !== 'mouse') return;
  const to = e.relatedTarget;
  if (!(e.target.closest('[data-mega]') || e.target.closest('#mega'))) return;
  if (to && (to.closest('[data-mega]') || to.closest('#mega'))) return;
  closeMegaSoon();
});
document.addEventListener('focusin', e => {
  if (e.target.closest('[data-mega]') || e.target.closest('#mega')) { openMega(); const mc = e.target.closest('[data-mega-cat]'); if (mc) setMegaCat(mc.dataset.megaCat); }
  else closeMega();
});
document.addEventListener('keydown', e => {
  const tab = e.target.closest && e.target.closest('.ltab');
  if (tab && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); const i = CAT_KEYS.indexOf(tab.dataset.lu), n = CAT_KEYS[(i + (e.key === 'ArrowRight' ? 1 : -1) + CAT_KEYS.length) % CAT_KEYS.length]; selectLineup(n, true); return; }
  if (e.key !== 'Escape') return;
  if ($('#mega') && !$('#mega').hidden) { const l = document.querySelector('[data-mega]'); closeMega(); if (l) l.focus(); return; }
  if (!$('#lightbox').hidden) return closeLightbox();
  if (!$('#search').hidden) return closeSearch();
  if (!$('#modal').hidden) return closeModal();
  toggleDrawer(false);
});
function navigate(){
  toggleDrawer(false); closeSearch();
  const run = () => { render(); try { window.scrollTo(0, 0); } catch (e) {} };
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce && typeof document.startViewTransition === 'function') { try { document.startViewTransition(run); return; } catch (e) {} }
  run();
  if (!reduce) { const m = $('#main'); m.classList.remove('page-in'); void m.offsetWidth; m.classList.add('page-in'); }
}
window.addEventListener('hashchange', navigate);

/* ---------------- boot ---------------- */
function boot(){
  $('#app').innerHTML = '<button type="button" class="skip" data-skip>본문으로 건너뛰기</button><header class="site-header" id="hdr"></header><main id="main" tabindex="-1"></main><footer class="site-footer" id="ftr"></footer>'
    + '<button type="button" class="fab w" id="fab" data-edit="log" data-new="1" data-project=""><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>글쓰기</button>'
    + '<div class="editbar" id="editbar" hidden></div><div id="modal" hidden></div>'
    + '<div class="search" id="search" role="dialog" aria-modal="true" aria-label="사이트 검색" hidden><div class="wrap"><div class="search-top"><label class="sr-only" for="search-q">검색어</label><input id="search-q" type="search" placeholder="무엇을 찾나요?" autocomplete="off"><button type="button" class="icon-btn" data-close-search aria-label="검색 닫기" style="font-size:32px">×</button></div><div class="search-res" id="search-res"></div></div></div>'
    + '<div id="lightbox" hidden><button type="button" class="icon-btn lb-close" aria-label="닫기">×</button><figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure></div>'
    + '<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toast-msg"></span><button type="button" id="toast-act" hidden></button></div>';
  const ret = store.get('pl-return', true);
  if (ret) { store.del('pl-return', true); if (!location.hash && ret !== '#') { try { history.replaceState(null, '', ret); } catch (e) {} } }
  render();
  const flash = store.get('pl-flash', true);
  if (flash) { store.del('pl-flash', true); setTimeout(() => toast(flash), 250); }
  initCaps(); initQA();
}
async function initCaps(){
  const C = window.claude;
  if (!C || typeof C.use !== 'function') return;
  try {
    const art = await C.use('artifact'); if (!art) return;
    let can = true;
    try { const u = await C.use('user'); if (u) can = await u.canEdit(); } catch (e) {}
    if (!can) return;
    ART = art; WRITABLE = true; document.body.classList.add('can-write');
    EDITING = store.get('pl-edit', true) === '1';
    const r = route();
    $('#hdr').innerHTML = headerHtml(r.page === 'project' ? 'projects' : r.page === 'entry' ? 'log' : r.page);
    applyEditing(); handlePending();
  } catch (e) {}
}
boot();
})();
</script>
